<!DOCTYPE html>
<html>
<head>
  <title>Voice AI Translator</title>

  <style>
    body{
      background:#0f0f0f;
      color:white;
      font-family:Arial;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      flex-direction:column;
    }

    h1{
      font-size:40px;
    }

    #status{
      margin-top:20px;
      font-size:25px;
      color:#00ffcc;
      text-align:center;
      width:80%;
    }

    .circle{
      width:140px;
      height:140px;
      border-radius:50%;
      background:#00ffcc;
      animation:pulse 1.5s infinite;
      margin-top:30px;
    }

    @keyframes pulse{
      0%{transform:scale(1);}
      50%{transform:scale(1.15);}
      100%{transform:scale(1);}
    }

  </style>
</head>

<body>

<h1>🎤 AI Voice Translator</h1>

<div class="circle"></div>

<div id="status">
Initializing AI...
</div>

<script>

const statusDiv = document.getElementById("status");

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

function speak(text, lang='en-US'){

    const utterance =
    new SpeechSynthesisUtterance(text);

    utterance.lang = lang;

    speechSynthesis.speak(utterance);
}

window.onload = () => {

    setTimeout(() => {

        speak(
        "Hello. I am ready. Please speak your sentence."
        );

        startListening();

    },1500);
};

function startListening(){

    const recognition = new SpeechRecognition();

    recognition.lang = 'auto';

    recognition.interimResults = false;

    recognition.start();

    statusDiv.innerHTML =
    "🎤 Listening for message...";

    recognition.onresult = (event) => {

        const spokenText =
        event.results[0][0].transcript;

        statusDiv.innerHTML =
        "You said: " + spokenText;

        askLanguage(spokenText);
    };

    recognition.onerror = () => {

        statusDiv.innerHTML =
        "Mic error. Restarting...";

        restart();
    };
}

function askLanguage(originalText){

    speak(
    "Which language should I translate to?"
    );

    const recognition2 = new SpeechRecognition();

    recognition2.lang = 'en-US';

    recognition2.start();

    statusDiv.innerHTML =
    "🌍 Listening for target language...";

    recognition2.onresult = async(event)=>{

        const targetLanguage =
        event.results[0][0].transcript
        .toLowerCase();

        statusDiv.innerHTML =
        "Target language: " +
        targetLanguage;

        translateText(
        originalText,
        targetLanguage
        );
    };

    recognition2.onerror = () => {

        restart();
    };
}

async function translateText(
text,
targetLanguage
){

    const languages = {

        hindi:'hi',
        english:'en',
        french:'fr',
        german:'de',
        spanish:'es',
        japanese:'ja',
        chinese:'zh',
        arabic:'ar',
        russian:'ru',
        korean:'ko',
        tamil:'ta',
        telugu:'te'
    };

    const targetCode =
    languages[targetLanguage];

    if(!targetCode){

        speak(
        "Sorry. Language not supported."
        );

        restart();

        return;
    }

    statusDiv.innerHTML =
    "🔄 Translating...";

    try{

        const response =
        await fetch(
        "https://libretranslate.de/translate",
        {
            method:"POST",

            headers:{
              "Content-Type":"application/json"
            },

            body:JSON.stringify({

                q:text,
                source:"auto",
                target:targetCode,
                format:"text"
            })
        });

        const data =
        await response.json();

        const translated =
        data.translatedText;

        statusDiv.innerHTML =
        "✅ " + translated;

        speak(translated, targetCode);

        setTimeout(()=>{

            restart();

        },5000);

    }catch(error){

        statusDiv.innerHTML =
        "Translation failed";

        restart();
    }
}

function restart(){

    setTimeout(()=>{

        startListening();

    },2000);
}

</script>

</body>
</html>
